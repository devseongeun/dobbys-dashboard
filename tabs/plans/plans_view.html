<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계획 보기 · 10-plans</title>
<!-- 구현 진행 현황 md 뷰어. plans_serve.py 가 /view.html 로 준다. 원문은 raw/<파일명>, 렌더러는 marked(vendor/marked.umd.js). 읽기 전용이다. -->
<style>
:root{
  --bg:#12141a;--card:#191c24;--card2:#1c2029;--line:#2a2f3a;--line2:#222733;
  --ink:#e7e9ee;--muted:#8b93a7;--dim:#646c80;--acc:#5eead4;--open:#fbbf24;--done:#4ade80;--warn:#fb923c;
}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(18,20,26,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar h1{margin:0;font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{background:#232833;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 12px;font:12px inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#232833;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:1px 10px;font-size:11.5px;white-space:nowrap}
.chip.doing{color:var(--acc);border-color:rgba(94,234,212,.35)}.chip.todo{color:#fcd34d;border-color:rgba(251,191,36,.35)}.chip.done{color:var(--done);border-color:rgba(74,222,128,.35)}
.chip.warn{color:var(--warn);border-color:rgba(251,146,60,.4)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding:20px 20px 80px}
.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;font-size:12.5px;border-right:1px solid var(--line2);padding-right:12px}
.toc b{display:block;color:var(--dim);font-size:11px;font-weight:500;margin-bottom:6px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:2px 0;line-height:1.45}
.toc a:hover{color:var(--acc)}
.toc a.h3{padding-left:12px;font-size:12px}
.msg{color:var(--muted);padding:24px 0}
.msg.err{color:#ffc9d4}
.md{min-width:0}
.md h1,.md h2,.md h3,.md h4{line-height:1.35;margin:1.6em 0 .6em}
.md h1{font-size:22px;margin-top:.2em}.md h2{font-size:18px;padding-bottom:6px;border-bottom:1px solid var(--line)}.md h3{font-size:15.5px}.md h4{font-size:14px;color:var(--muted)}
.md a{color:var(--acc)}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md .tbl{margin:0 0 .9em}
.md ul,.md ol{padding-left:1.5em}
.md li+li{margin-top:2px}
.md li.task{list-style:none;margin-left:-1.3em}
.md input[type=checkbox]{accent-color:var(--done);margin:0 6px 0 0;vertical-align:-2px}
.md li.task.checked{color:var(--muted)}
.md code{font:12.5px ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;background:#1f232c;border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.md pre{background:#161920;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto}
.md pre code{background:none;border:0;padding:0;font-size:12px;line-height:1.55}
.md blockquote{border-left:3px solid var(--line);margin-left:0;padding:2px 0 2px 14px;color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.md .tbl{overflow:auto}
.md table{border-collapse:collapse;font-size:12.5px}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--card2);color:var(--muted);font-weight:600}
.md .embed{color:var(--dim);font-style:italic}
@media (max-width:900px){.layout{grid-template-columns:1fr}.toc{display:none}}
</style>
</head>
<body>
<header class="bar">
  <a class="back" id="back" href="./">← 목록</a>
  <h1 id="title">계획 보기</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="layout">
  <nav class="toc" id="toc" aria-label="목차"><b>목차</b></nav>
  <main class="md" id="doc"><p class="msg">불러오는 중…</p></main>
</div>
<script src="marked.umd.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const STATES = { "할 일": "todo", "할일": "todo", "todo": "todo", "진행 중": "doing", "진행중": "doing", "doing": "doing", "완료": "done", "done": "done" };
  const LABELS = { todo: "할 일", doing: "진행 중", done: "완료" };
  const FENCE = /^\s*(```|~~~)/;

  // 맨 앞 --- 블록에서 한 줄짜리 "키: 값"만 읽는다(plans_index.py 와 같은 규칙).
  const splitFrontmatter = (src) => {
    const lines = src.split("\n");
    if (lines[0].trim() !== "---") return { meta: {}, body: src };
    const end = lines.findIndex((l, i) => i > 0 && l.trim() === "---");
    if (end < 0) return { meta: {}, body: src };
    const meta = {};
    for (const line of lines.slice(1, end)) {
      const m = line.match(/^([^\s:-][^:]*):\s*(.*)$/);
      if (m) meta[m[1].trim()] = m[2].trim().replace(/^["']|["']$/g, "");
    }
    return { meta, body: lines.slice(end + 1).join("\n") };
  };

  // Obsidian 문법을 일반 md로 바꾼다. 펜스 코드 블록 안은 그대로 둔다.
  const obsidian = (body) => {
    let fenced = false;
    return body.split("\n").map((line) => {
      if (FENCE.test(line)) { fenced = !fenced; return line; }
      if (fenced) return line;
      return line
        .replace(/!\[\[([^\]|]+)(?:\\?\|[^\]]*)?\]\]/g, (_, f) => `<span class="embed">[이미지: ${f}]</span>`)
        .replace(/\[\[([^\]|]+?)\\?\|([^\]]+)\]\]/g, "$2")
        .replace(/\[\[([^\]]+)\]\]/g, "$1");
    }).join("\n");
  };

  const chip = (text, cls = "") => {
    const el = document.createElement("span");
    el.className = "chip " + cls;
    el.textContent = text;
    return el;
  };

  const toSlug = (text) => text.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "") || "sec";
  const slug = (text, used) => {
    const base = toSlug(text);
    let id = base, n = 2;
    while (used.has(id)) id = `${base}-${n++}`;
    used.add(id);
    return id;
  };

  const decorate = (doc) => {
    // 표는 가로 스크롤 상자에 넣는다.
    doc.querySelectorAll("table").forEach((t) => {
      const box = document.createElement("div");
      box.className = "tbl";
      t.replaceWith(box);
      box.appendChild(t);
    });
    // 체크박스 줄 표시(느슨한 목록은 <li><p><input> 형태라 li 아래 어디든 찾는다).
    doc.querySelectorAll("li input[type=checkbox]").forEach((box) => {
      const li = box.closest("li");
      box.disabled = true;
      li.classList.add("task");
      if (box.checked) li.classList.add("checked");
    });
    // 같은 폴더 md 링크는 뷰어로, 바깥 링크는 새 탭으로. 문서 안 #앵커는 해시(=파일명)를 건드리지 않고 스크롤만 한다.
    doc.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (href.startsWith("#")) {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const target = document.getElementById(toSlug(decodeURIComponent(href.slice(1))));
          if (target) target.scrollIntoView({ block: "start" });
        });
        return;
      }
      if (/^[a-z][a-z0-9+.-]*:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (/\.md(#.*)?$/.test(href) && !href.includes("/")) a.href = "view.html#" + encodeURIComponent(decodeURIComponent(href.replace(/#.*$/, "")));
    });
    // 목차(h1~h3).
    const used = new Set();
    const toc = $("toc");
    doc.querySelectorAll("h1, h2, h3").forEach((h) => {
      h.id = slug(h.textContent, used);
      const a = document.createElement("a");
      a.href = "#";
      a.className = h.tagName.toLowerCase();
      a.textContent = h.textContent;
      a.addEventListener("click", (e) => { e.preventDefault(); h.scrollIntoView({ block: "start" }); });
      toc.appendChild(a);
    });
    toc.hidden = used.size === 0;
  };

  const showMeta = (meta, doc) => {
    const box = $("meta");
    const state = STATES[(meta.status || "").toLowerCase()];
    if (state) box.appendChild(chip(LABELS[state], state));
    else if (meta.status) box.appendChild(chip("status: " + meta.status));
    if (meta.progress) box.appendChild(chip("진행률 " + meta.progress.replace(/%$/, "") + "%"));
    const boxes = [...doc.querySelectorAll("li.task input[type=checkbox]")];
    if (boxes.length) {
      const checked = boxes.filter((b) => b.checked).length;
      const warn = state === "done" && checked < boxes.length;
      box.appendChild(chip(`체크 ${checked}/${boxes.length}` + (warn ? " ⚠" : ""), warn ? "warn" : ""));
    }
    const updated = meta.updated || meta.created;
    if (updated) box.appendChild(chip("갱신 " + updated));
  };

  const load = async () => {
    const name = decodeURIComponent(location.hash.slice(1));
    const doc = $("doc");
    $("toc").querySelectorAll("a").forEach((a) => a.remove());
    $("meta").replaceChildren();
    if (!name) { doc.innerHTML = '<p class="msg err">열 계획 파일명이 없다. 목록에서 계획을 누른다.</p>'; return; }
    $("title").textContent = name.replace(/\.md$/, "");
    document.title = name.replace(/\.md$/, "") + " · 10-plans";
    try {
      const res = await fetch("raw/" + encodeURIComponent(name), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status === 404 ? "파일이 없거나 열 수 없는 경로다" : "HTTP " + res.status);
      const { meta, body } = splitFrontmatter(await res.text());
      doc.innerHTML = marked.parse(obsidian(body), { gfm: true });
      decorate(doc);
      showMeta(meta, doc);
      window.scrollTo(0, 0);
    } catch (err) {
      doc.innerHTML = "";
      const p = document.createElement("p");
      p.className = "msg err";
      p.textContent = `${name} 을(를) 불러오지 못했다: ${err.message}`;
      doc.appendChild(p);
    }
  };

  // 목록에서 왔으면 뒤로 가기로 돌아가 탭·필터·검색 상태를 살린다.
  $("back").addEventListener("click", (e) => {
    const ref = document.referrer && new URL(document.referrer);
    if (ref && ref.origin === location.origin && ref.pathname === new URL("./", location.href).pathname) {
      e.preventDefault();
      history.back();
    }
  });
  window.addEventListener("hashchange", load);
  load();
})();
</script>
</body>
</html>
