<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회의 자료 · 70-meetings</title>
<!-- 회의 자료 화면. meetings_serve.py 가 / 로 준다. 원본은 TRB_400/70-meetings/*.canvas(블록 안 순서는 .order/). 대시보드·Obsidian 둘 다 편집한다. -->
<link rel="stylesheet" href="meetings.css">
</head>
<body>
<aside class="side">
  <section class="list">
    <header><b>회의 자료</b><span class="tools"><button class="btn" id="new-meeting" type="button">+ 회의</button><button class="btn" id="reload" type="button" title="Canvas·트리 다시 읽기">⟳</button></span></header>
    <div id="new-meeting-slot"></div>
    <ul id="meetings"></ul>
  </section>
  <section class="tree">
    <header><b>Vault</b><input id="tree-search" type="search" placeholder="파일 검색" autocomplete="off"></header>
    <div class="tree-body" id="tree"></div>
    <p class="hint">파일을 누르면 오른쪽에서 미리 본다. 미리보기의 <b>+ 담기</b>나 블록으로 끌어다 놓기로 담는다. 블록 = Canvas 그룹.</p>
  </section>
</aside>
<main class="board">
  <header class="bar">
    <h1 id="title" title="눌러서 회의 이름 바꾸기">회의를 고른다</h1>
    <span class="notice" id="notice" hidden></span>
    <button class="btn" id="new-block" type="button" hidden>+ 블록</button>
    <a class="btn" id="open-canvas" hidden>Obsidian에서 열기 ↗</a>
  </header>
  <div id="new-block-slot"></div>
  <div class="blocks" id="blocks"></div>
</main>
<section class="preview" id="preview" hidden>
  <header class="bar">
    <h2 id="preview-title"></h2>
    <span class="add-to" id="preview-add"></span>
    <a class="btn" id="preview-open">Obsidian에서 열기 ↗</a>
    <a class="btn" id="preview-close">닫기 ✕</a>
  </header>
  <div class="preview-body" id="preview-body"></div>
</section>
<script src="marked.umd.js"></script>
<script type="module" src="meetings.js"></script>
</body>
</html>
