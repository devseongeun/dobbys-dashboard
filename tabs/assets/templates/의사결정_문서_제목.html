<!--
의사결정 현황 탭이 읽는 규칙. 다 읽었으면 이 주석은 지워도 된다.
- 위치: 설정한 의사결정 문서 폴더 바로 아래. 하위 폴더와 `00_`으로 시작하는 파일은 읽지 않는다.
- 화면 이름: 파일명에서 `.html`, 앞의 `프로젝트_버전_`(예: TRB_4.0.0_), 끝의 `_v1.0`을 떼고 밑줄을 공백으로 바꾼다.
- 기능 구분·작성일: head의 feature meta(content="A, B")와 created meta(content="YYYY-MM-DD"). 둘 다 head 안에서 한 번씩만 쓴다.
- 상태: 아래 문의 현황 표(docst)에서만 읽는다. 표를 통째로 지우면 참고 문서로 분류한다.
  - <section class="docst" data-doc="open|closed"> 는 속성 순서·따옴표까지 그대로 둔다.
    미결 행이 하나라도 있으면 open(진행 중), 없으면 closed(종결).
  - 메타 줄의 회신 대상<b>…</b>, 집계<b>미결 n · 완료 n · 취소됨 n</b>, 최종 갱신<b>YYYY-MM-DD</b> 형식을 바꾸지 않는다.
  - 행 상태 data-docst 는 open(미결) · done(완료) · cancel(취소됨) 셋만 쓴다.
  - 답변을 받으면 행의 data-docst·답변 칸, 집계, data-doc, 최종 갱신을 함께 고친다.
-->

<section class="docst" data-doc="open" aria-label="문의 현황">
<style>
.docst{display:block;box-sizing:border-box;max-width:1100px;margin:16px auto 24px;padding:16px 18px;border:1px solid #e2e5ea;border-radius:10px;background:#fff;color:#1c1f26;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;text-align:left}
.docst *{box-sizing:border-box}
.docst b{color:inherit;font-weight:inherit}
.docst-hd{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.docst-hd>b{font-size:15px;font-weight:700;color:#1c1f26}
.docst-doc{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700}
.docst[data-doc="open"] .docst-doc{background:#fef6e7;color:#b45309}
.docst[data-doc="closed"] .docst-doc{background:#ecfdf5;color:#047857}
.docst[data-doc="open"] .docst-doc::after{content:"진행 중"}
.docst[data-doc="closed"] .docst-doc::after{content:"종결"}
.docst-meta{display:flex;flex-wrap:wrap;gap:2px 18px;margin:0 0 10px;padding:0;font-size:13px;color:#4a505c}
.docst-meta b{margin-left:6px;font-weight:600;color:#1c1f26}
.docst table{width:100%;border-collapse:collapse;margin:0;font-size:13px}
.docst th,.docst td{border:1px solid #e2e5ea;border-radius:0;padding:6px 8px;vertical-align:top;text-align:left;min-width:0;background:#fff!important;color:#1c1f26}
.docst th{background:#f6f7f9!important;font-weight:600;color:#4a505c;white-space:nowrap}
.docst code{background:#f1f3f6;color:#1c1f26;border:0;padding:0 4px;border-radius:4px;font:12px ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace}
.docst td:first-child{white-space:nowrap;color:#8a90a0}
.docst td.docst-s{white-space:nowrap;font-weight:600;color:#4a505c}
.docst-s i{display:inline-block;width:15px;height:15px;border-radius:4px;border:1.5px solid #dfe3ea;background:#fff;margin-right:6px;vertical-align:-3px;position:relative;font-style:normal}
.docst tr[data-docst="open"] .docst-s b::after{content:"미결"}
.docst tr[data-docst="done"] .docst-s b::after{content:"완료"}
.docst tr[data-docst="cancel"] .docst-s b::after{content:"취소됨"}
.docst tr[data-docst="done"] td.docst-s{color:#047857}
.docst tr[data-docst="done"] .docst-s i{border-color:#6ee7b7;background:#ecfdf5}
.docst tr[data-docst="done"] .docst-s i::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #059669;border-width:0 2px 2px 0;transform:rotate(43deg)}
.docst tr[data-docst="cancel"] td.docst-s{color:#ea7317}
.docst tr[data-docst="cancel"] .docst-s i{border-color:#fb923c;background:#fff7ed}
.docst tr[data-docst="cancel"] .docst-s i::after{content:"";position:absolute;left:2.5px;top:5px;width:7px;height:2px;border-radius:2px;background:#f97316}
.docst-note{margin:8px 0 0;font-size:12px;color:#8a90a0}
@media print{.docst{break-inside:avoid}}
</style>
<div class="docst-hd"><b>문의 현황</b><span class="docst-doc"></span></div>

</tbody>
</table>
</section>
