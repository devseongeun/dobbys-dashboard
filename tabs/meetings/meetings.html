<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회의 자료 · 70-meetings</title>
<!-- 회의 자료 화면. 대시보드 /meetings/ 아래에서 meetings_serve.py 가 / 로 준다. 원본은 설정에서 고른 회의 폴더의 *.canvas(블록 안 순서는 .order/). 대시보드·Obsidian 둘 다 편집한다. -->
<link rel="stylesheet" href="meetings.css">
</head>
<body>
<aside class="side">
  <section class="list">
    <header><b>회의 자료</b><span class="tools"><button class="btn" id="new-meeting" type="button">+ 업무</button><button class="btn" id="reload" type="button" title="Canvas·트리 다시 읽기">⟳</button></span></header>
    <div class="list-search"><input id="meeting-search" type="search" placeholder="업무 검색" autocomplete="off"></div>
    <div id="new-meeting-slot"></div>
    <ul id="meetings"></ul>
  </section>
  <section class="tree">
    <header><b>Vault</b><input id="tree-search" type="search" placeholder="파일 검색" autocomplete="off"></header>
    <div class="tree-body" id="tree"></div>
    <p class="hint">파일을 누르면 오른쪽에서 미리 본다. 미리보기의 <b>+ 담기</b>나 회의 블록으로 끌어다 놓기로 담는다. 업무 = Canvas 파일, 회의 = Canvas 그룹.</p>
  </section>
  <div class="resizer" id="side-resizer" role="separator" aria-orientation="vertical" aria-label="Vault 칸 너비" tabindex="0" title="끌어서 너비 조절 · 두 번 눌러 기본 너비"></div>
</aside>
<main class="board">
  <header class="bar">
    <h1 id="title" title="눌러서 업무 이름 바꾸기">업무를 고른다</h1>
    <span class="notice" id="notice" hidden></span>
    <button class="btn" id="new-block" type="button" hidden>+ 회의</button>
    <span class="menu-wrap">
      <button class="btn" id="meeting-menu" type="button" aria-haspopup="menu" aria-expanded="false" title="업무 메뉴" hidden>⋯</button>
      <div class="menu" id="meeting-menu-list" role="menu" hidden>
        <button type="button" role="menuitem" data-act="rename">업무 이름 바꾸기</button>
        <a role="menuitem" id="open-canvas">Obsidian에서 열기 ↗</a>
        <button type="button" role="menuitem" data-act="delete" class="danger">업무 삭제</button>
      </div>
    </span>
  </header>
  <div id="new-block-slot"></div>
  <div class="blocks" id="blocks"></div>
</main>
<section class="preview" id="preview" hidden>
  <div class="resizer" id="preview-resizer" role="separator" aria-orientation="vertical" aria-label="미리보기 너비" tabindex="0" title="끌어서 너비 조절 · 두 번 눌러 기본 너비"></div>
  <header class="bar">
    <h2 id="preview-title"></h2>
    <span class="add-to" id="preview-add"></span>
    <a class="btn" id="preview-open">Obsidian에서 열기 ↗</a>
    <a class="btn" id="preview-close">닫기 ✕</a>
  </header>
  <div class="preview-body" id="preview-body"></div>
</section>
<script src="marked.umd.js"></script>
<script type="module" src="meetings.js"></script>
</body>
</html>
